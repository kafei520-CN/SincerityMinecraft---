<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<title>皮肤路径追踪</title>
<canvas id="view"></canvas>
<script>
/**
 * 在显卡上对 Minecraft 皮肤模型做路径追踪。
 * 移植自 Null-K/blockbench-plugins pathtracer.js (MIT License, Copyright (c) 2026 PuddingKC)
 *
 * 原插件为 Blockbench 从场景取模型；这里改为接受预先生成的三角形 + 材质数据。
 * BVH、材质图集、环境光、太阳、地面、GGX + MIS、透射、降噪、泛光、色调映射等核心算法
 * 照抄原插件，保留完整渲染链。
 */

const TRI_POS_TEXELS = 3;
const TRI_ATTR_TEXELS = 4;
const MAT_TEXELS = 5;
const BVH_TEXELS = 2;
const DATA_TEX_WIDTH = 1024;
const MAX_LEAF_TRIS = 8;
const SAH_BINS = 12;
const ENV_W = 1024, ENV_H = 512;
const ENV_DIST_W = 256, ENV_DIST_H = 128;

const MF_HAS_COLOR = 1;
const MF_HAS_MER = 2;
const MF_HAS_NORMAL = 4;
const MF_FULLBRIGHT = 8;
const MF_WRAP_REPEAT = 16;
const MF_ADDITIVE = 32;
const MF_HAS_EMISSIVE_MAP = 64;
const MF_EMIS_MAIN_COLOR = 128;
const MF_EMIS_CUSTOM_COLOR = 256;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

function hexToLinear(hex) {
  let h = (hex || '#000000').replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const r = parseInt(h.substr(0, 2), 16) / 255;
  const g = parseInt(h.substr(2, 2), 16) / 255;
  const b = parseInt(h.substr(4, 2), 16) / 255;
  return [srgbToLinear(r), srgbToLinear(g), srgbToLinear(b)];
}

function srgbToLinear(c) {
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}

function vNorm(v) {
  const l = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / l, v[1] / l, v[2] / l];
}
function vSub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function vAdd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function vScale(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function vCross(a, b) {
  return [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0],
  ];
}
function vDot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }

function nextPow2(n) {
  let p = 1;
  while (p < n) p *= 2;
  return p;
}

function compileShader(gl, type, source, label) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, source);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh);
    console.error('[PathTracer] shader compile failed: ' + label + '\n' + log);
    console.error(source.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
    gl.deleteShader(sh);
    throw new Error('Shader compile error (' + label + '): ' + log);
  }
  return sh;
}

function createProgram(gl, vsSource, fsSource, label) {
  const vs = compileShader(gl, gl.VERTEX_SHADER, vsSource, label + '.vert');
  const fs = compileShader(gl, gl.FRAGMENT_SHADER, fsSource, label + '.frag');
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(prog);
    gl.deleteProgram(prog);
    throw new Error('Program link error (' + label + '): ' + log);
  }

  const uniforms = {};
  const count = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const info = gl.getActiveUniform(prog, i);
    const name = info.name.replace(/\[0\]$/, '');
    uniforms[name] = gl.getUniformLocation(prog, name);
  }
  return { program: prog, uniforms: uniforms };
}

function createDataTexture(gl, data, texelCount, width) {
  const w = width || DATA_TEX_WIDTH;
  const h = Math.max(1, Math.ceil(texelCount / w));
  const buf = new Float32Array(w * h * 4);
  if (data) buf.set(data.subarray(0, Math.min(data.length, buf.length)));
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, w, h, 0, gl.RGBA, gl.FLOAT, buf);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindTexture(gl.TEXTURE_2D, null);
  return { texture: tex, width: w, height: h };
}

function createR32FTexture(gl, data, w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, w, h, 0, gl.RED, gl.FLOAT, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindTexture(gl.TEXTURE_2D, null);
  return tex;
}

function createAtlasTexture(gl, pixels, w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindTexture(gl.TEXTURE_2D, null);
  return tex;
}

function createEnvTexture(gl, data, w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.FLOAT, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindTexture(gl.TEXTURE_2D, null);
  return tex;
}

function createRenderTexture(gl, w, h, internalFormat) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  const fmt = internalFormat || gl.RGBA32F;
  const uploadFormat = fmt === gl.R32F ? gl.RED : gl.RGBA;
  gl.texImage2D(gl.TEXTURE_2D, 0, fmt, w, h, 0, uploadFormat, gl.FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindTexture(gl.TEXTURE_2D, null);
  return tex;
}

function createFBO(gl, attachments) {
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  const bufs = [];
  attachments.forEach((tex, i) => {
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, tex, 0);
    bufs.push(gl.COLOR_ATTACHMENT0 + i);
  });
  gl.drawBuffers(bufs);
  const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (status !== gl.FRAMEBUFFER_COMPLETE) {
    throw new Error('Framebuffer incomplete: 0x' + status.toString(16));
  }
  return fbo;
}

function buildBVH(positions, triCount) {
  if (triCount === 0) {
    const nodes = new Float32Array(8);
    nodes[3] = 0; nodes[7] = 0;
    return { nodes: nodes, nodeCount: 1, order: new Uint32Array(0) };
  }

  const bmin = new Float32Array(triCount * 3);
  const bmax = new Float32Array(triCount * 3);
  const cent = new Float32Array(triCount * 3);
  for (let i = 0; i < triCount; i++) {
    const o = i * 9;
    for (let a = 0; a < 3; a++) {
      let mn = Infinity, mx = -Infinity;
      for (let v = 0; v < 3; v++) {
        const val = positions[o + v * 3 + a];
        if (val < mn) mn = val;
        if (val > mx) mx = val;
      }
      bmin[i * 3 + a] = mn;
      bmax[i * 3 + a] = mx;
      cent[i * 3 + a] = (mn + mx) * 0.5;
    }
  }

  const order = new Uint32Array(triCount);
  for (let i = 0; i < triCount; i++) order[i] = i;

  const nodes = new Float32Array(triCount * 2 * 8);
  let nodeCount = 0;

  function alloc() {
    const i = nodeCount;
    nodeCount++;
    return i;
  }

  function build(start, count) {
    const node = alloc();
    const base = node * 8;
    let boxMin = [Infinity, Infinity, Infinity];
    let boxMax = [-Infinity, -Infinity, -Infinity];
    for (let i = 0; i < count; i++) {
      const t = order[start + i];
      for (let a = 0; a < 3; a++) {
        if (bmin[t * 3 + a] < boxMin[a]) boxMin[a] = bmin[t * 3 + a];
        if (bmax[t * 3 + a] > boxMax[a]) boxMax[a] = bmax[t * 3 + a];
      }
    }
    nodes[base + 0] = boxMin[0];
    nodes[base + 1] = boxMin[1];
    nodes[base + 2] = boxMin[2];
    nodes[base + 4] = boxMax[0];
    nodes[base + 5] = boxMax[1];
    nodes[base + 6] = boxMax[2];

    if (count <= MAX_LEAF_TRIS) {
      nodes[base + 3] = start;
      nodes[base + 7] = count;
      return node;
    }

    let bestAxis = 0, bestPos = 0, bestCost = Infinity;
    for (let axis = 0; axis < 3; axis++) {
      const cmin = boxMin[axis], cmax = boxMax[axis];
      if (cmax - cmin < 1e-7) continue;
      const binW = (cmax - cmin) / SAH_BINS;
      const bins = new Array(SAH_BINS);
      for (let b = 0; b < SAH_BINS; b++) bins[b] = {count: 0, box: [Infinity, Infinity, Infinity, -Infinity, -Infinity, -Infinity]};
      for (let i = 0; i < count; i++) {
        const t = order[start + i];
        const c = cent[t * 3 + axis];
        let bin = Math.floor((c - cmin) / binW);
        if (bin >= SAH_BINS) bin = SAH_BINS - 1;
        bins[bin].count++;
        const bb = bins[bin].box;
        for (let a = 0; a < 3; a++) {
          if (bmin[t * 3 + a] < bb[a]) bb[a] = bmin[t * 3 + a];
          if (bmax[t * 3 + a] > bb[a + 3]) bb[a + 3] = bmax[t * 3 + a];
        }
      }
      const leftBox = new Array(SAH_BINS);
      const rightBox = new Array(SAH_BINS);
      let lbox = [Infinity, Infinity, Infinity, -Infinity, -Infinity, -Infinity];
      for (let b = 0; b < SAH_BINS; b++) {
        const bb = bins[b].box;
        for (let a = 0; a < 3; a++) {
          if (bb[a] < lbox[a]) lbox[a] = bb[a];
          if (bb[a + 3] > lbox[a + 3]) lbox[a + 3] = bb[a + 3];
        }
        leftBox[b] = lbox.slice();
      }
      let rbox = [Infinity, Infinity, Infinity, -Infinity, -Infinity, -Infinity];
      for (let b = SAH_BINS - 1; b >= 0; b--) {
        const bb = bins[b].box;
        for (let a = 0; a < 3; a++) {
          if (bb[a] < rbox[a]) rbox[a] = bb[a];
          if (bb[a + 3] > rbox[a + 3]) rbox[a + 3] = bb[a + 3];
        }
        rightBox[b] = rbox.slice();
      }
      let leftCount = 0;
      for (let pos = 0; pos < SAH_BINS - 1; pos++) {
        leftCount += bins[pos].count;
        const rightCount = count - leftCount;
        if (leftCount === 0 || rightCount === 0) continue;
        const lsa = surfaceArea(leftBox[pos]);
        const rsa = surfaceArea(rightBox[pos + 1]);
        const cost = leftCount * lsa + rightCount * rsa;
        if (cost < bestCost) { bestCost = cost; bestAxis = axis; bestPos = pos; }
      }
    }

    if (bestCost === Infinity) {
      nodes[base + 3] = start;
      nodes[base + 7] = count;
      return node;
    }

    const axis = bestAxis;
    const cmin = boxMin[axis], cmax = boxMax[axis];
    const binW = (cmax - cmin) / SAH_BINS;
    const threshold = cmin + (bestPos + 1) * binW;
    let l = start, r = start + count - 1;
    while (l <= r) {
      const c = cent[order[l] * 3 + axis];
      if (c < threshold) l++;
      else {
        const tmp = order[l];
        order[l] = order[r];
        order[r] = tmp;
        r--;
      }
    }
    const mid = l;
    if (mid === start || mid === start + count) {
      nodes[base + 3] = start;
      nodes[base + 7] = count;
      return node;
    }

    const left = build(start, mid - start);
    const right = build(mid, start + count - mid);
    nodes[base + 3] = left;
    nodes[base + 7] = 0;
    return node;
  }

  build(0, triCount);

  return { nodes: nodes, nodeCount: nodeCount, order: order };
}

function surfaceArea(b) {
  const dx = b[3] - b[0], dy = b[4] - b[1], dz = b[5] - b[2];
  if (dx < 0 || dy < 0 || dz < 0) return 0;
  return 2 * (dx * dy + dy * dz + dz * dx);
}

function tryPackShelf(entries, size) {
  let x = 0, y = 0, shelfH = 0;
  const rects = new Array(entries.length);
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    if (e.w > size || e.h > size) return null;
    if (x + e.w > size) { x = 0; y += shelfH; shelfH = 0; }
    if (y + e.h > size) return null;
    rects[e.order] = { x: x, y: y, w: e.w, h: e.h };
    x += e.w;
    if (e.h > shelfH) shelfH = e.h;
  }
  return rects;
}

function packAtlas(sizes, maxSize) {
  const entries = sizes.map((s, i) => ({ w: s[0], h: s[1], order: i }));
  entries.sort((a, b) => b.h - a.h || b.w - a.w);
  let size = 64;
  while (size <= maxSize) {
    const rects = tryPackShelf(entries, size);
    if (rects) return { size: size, rects: rects };
    size *= 2;
  }
  return null;
}

function generateSkyPixels(settings) {
  const w = ENV_W, h = ENV_H;
  const out = new Float32Array(w * h * 4);
  const mode = settings.env_mode;

  const zen = hexToLinear(settings.sky_zenith);
  const hor = hexToLinear(settings.sky_horizon);
  const gnd = hexToLinear(settings.sky_ground);
  const gTop = hexToLinear(settings.grad_top);
  const gBot = hexToLinear(settings.grad_bottom);
  const solid = hexToLinear(settings.solid_color);
  const sunCol = hexToLinear(settings.sun_color);
  const haze = clamp(settings.sky_haze, 0, 1);
  const sun = sunDirection(settings);
  const glowPower = 8 + 260 * (1 - haze);
  const glowStrength = 0.35 + 2.5 * haze;

  for (let y = 0; y < h; y++) {
    const theta = ((y + 0.5) / h) * Math.PI;
    const sinT = Math.sin(theta), cosT = Math.cos(theta);
    for (let x = 0; x < w; x++) {
      const phi = ((x + 0.5) / w - 0.5) * 2 * Math.PI;
      const dx = sinT * Math.cos(phi);
      const dy = cosT;
      const dz = sinT * Math.sin(phi);
      const o = (y * w + x) * 4;
      let r = 0, g = 0, b = 0;

      if (mode === 'solid') {
        r = solid[0]; g = solid[1]; b = solid[2];
      } else if (mode === 'gradient') {
        const t = clamp(dy * 0.5 + 0.5, 0, 1);
        r = gBot[0] + (gTop[0] - gBot[0]) * t;
        g = gBot[1] + (gTop[1] - gBot[1]) * t;
        b = gBot[2] + (gTop[2] - gBot[2]) * t;
      } else {
        if (dy >= 0) {
          const t = Math.pow(dy, 0.55);
          r = hor[0] + (zen[0] - hor[0]) * t;
          g = hor[1] + (zen[1] - hor[1]) * t;
          b = hor[2] + (zen[2] - hor[2]) * t;
        } else {
          const t = Math.pow(-dy, 0.4);
          r = hor[0] * 0.55 + (gnd[0] - hor[0] * 0.55) * t;
          g = hor[1] * 0.55 + (gnd[1] - hor[1] * 0.55) * t;
          b = hor[2] * 0.55 + (gnd[2] - hor[2] * 0.55) * t;
        }
        const cosA = dx * sun[0] + dy * sun[1] + dz * sun[2];
        if (cosA > 0 && settings.sun_enable && settings.sun_intensity > 0) {
          const glow = Math.pow(cosA, glowPower) * glowStrength;
          r += sunCol[0] * glow;
          g += sunCol[1] * glow;
          b += sunCol[2] * glow;
        }
      }

      out[o] = r; out[o + 1] = g; out[o + 2] = b; out[o + 3] = 1;
    }
  }
  return out;
}

function sunDirection(settings) {
  const el = settings.sun_elevation * Math.PI / 180;
  const az = settings.sun_azimuth * Math.PI / 180;
  const ce = Math.cos(el);
  return vNorm([ce * Math.cos(az), Math.sin(el), ce * Math.sin(az)]);
}

function buildEnvDistribution(pixels, w, h) {
  const DW = ENV_DIST_W, DH = ENV_DIST_H;
  const bx = Math.max(1, Math.floor(w / DW));
  const by = Math.max(1, Math.floor(h / DH));

  const lum = new Float32Array(DW * DH);
  let total = 0;
  for (let y = 0; y < DH; y++) {
    const theta = ((y + 0.5) / DH) * Math.PI;
    const sinT = Math.max(Math.sin(theta), 1e-4);
    for (let x = 0; x < DW; x++) {
      let acc = 0, n = 0;
      for (let sy = 0; sy < by; sy++) {
        const py = Math.min(h - 1, y * by + sy);
        for (let sx = 0; sx < bx; sx++) {
          const px = Math.min(w - 1, x * bx + sx);
          const o = (py * w + px) * 4;
          acc += 0.2126 * pixels[o] + 0.7152 * pixels[o + 1] + 0.0722 * pixels[o + 2];
          n++;
        }
      }
      const v = (acc / Math.max(n, 1)) * sinT;
      lum[y * DW + x] = v;
      total += v;
    }
  }

  const mean = total / (DW * DH);
  const eps = Math.max(mean * 0.06, 1e-8);
  total = 0;
  for (let i = 0; i < lum.length; i++) { lum[i] += eps; total += lum[i]; }
  if (total <= 0) { for (let i = 0; i < lum.length; i++) lum[i] = 1; total = lum.length; }

  const cond = new Float32Array((DW + 1) * DH);
  const rowSum = new Float32Array(DH);
  for (let y = 0; y < DH; y++) {
    let acc = 0;
    for (let x = 0; x < DW; x++) acc += lum[y * DW + x];
    rowSum[y] = acc;
    const base = y * (DW + 1);
    let run = 0;
    cond[base] = 0;
    for (let x = 0; x < DW; x++) {
      run += lum[y * DW + x];
      cond[base + x + 1] = acc > 0 ? run / acc : (x + 1) / DW;
    }
    cond[base + DW] = 1;
  }

  const marg = new Float32Array(DH + 1);
  let sum = 0;
  for (let y = 0; y < DH; y++) sum += rowSum[y];
  let run = 0;
  marg[0] = 0;
  for (let y = 0; y < DH; y++) {
    run += rowSum[y];
    marg[y + 1] = sum > 0 ? run / sum : (y + 1) / DH;
  }
  marg[DH] = 1;

  return { cond: cond, marg: marg, width: DW, height: DH };
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error('皮肤图片无法解码'));
    image.src = src;
  });
}

const VS_FULLSCREEN = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}
`;

const FS_PATHTRACE = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;

#define PI 3.141592653589793
#define INV_PI 0.3183098861837907
#define TFAR 1.0e20
#define RAY_EPS 1.0e-3

#define MF_HAS_COLOR   1
#define MF_HAS_MER     2
#define MF_HAS_NORMAL  4
#define MF_FULLBRIGHT  8
#define MF_WRAP_REPEAT 16
#define MF_ADDITIVE    32
#define MF_HAS_EMISSIVE_MAP 64
#define MF_EMIS_MAIN_COLOR  128
#define MF_EMIS_CUSTOM_COLOR 256

uniform vec2 uResolution;
uniform int  uSeed;
uniform int  uMaxBounce;
uniform int  uLightSamples;
uniform float uClamp;
uniform int  uFilterLinear;

uniform vec3 uCamPos, uCamRight, uCamUp, uCamForward;
uniform float uTanHalfFov, uAspect, uOrthoHalfHeight;
uniform int  uOrtho;
uniform float uAperture, uFocusDist;

uniform sampler2D uTriPos;
uniform sampler2D uTriAttr;
uniform sampler2D uBVH;
uniform sampler2D uMat;
uniform sampler2D uAtlasC;
uniform sampler2D uAtlasM;
uniform sampler2D uAtlasN;

uniform sampler2D uLightTex;
uniform int uTriPosW, uTriAttrW, uBVHW, uMatW, uLightW;

layout(location = 0) out vec4 outColor;
layout(location = 1) out vec4 outAlbedo;
layout(location = 2) out vec4 outNormal;
layout(location = 3) out vec4 outMoment;

uint g_rng;
uint pcgNext() {
	g_rng = g_rng * 747796405u + 2891336453u;
	uint w = ((g_rng >> ((g_rng >> 28u) + 4u)) ^ g_rng) * 277803737u;
	return (w >> 22u) ^ w;
}
float rnd() { return float(pcgNext()) * (1.0 / 4294967296.0); }
vec2 rnd2() { return vec2(rnd(), rnd()); }

vec4 fetchAt(sampler2D s, int idx, int w) {
	return texelFetch(s, ivec2(idx - (idx / w) * w, idx / w), 0);
}
vec4 fTri(int i) { return fetchAt(uTriPos, i, uTriPosW); }
vec4 fAttr(int i) { return fetchAt(uTriAttr, i, uTriAttrW); }
vec4 fBVH(int i) { return fetchAt(uBVH, i, uBVHW); }
vec4 fMat(int i) { return fetchAt(uMat, i, uMatW); }

struct Mat {
	vec3 tint;
	int flags;
	vec4 rect;
	float rough, metal, emis, ior;
	float transm, cutoff, nscale;
	int amode;
	vec3 emisColor;
};

Mat loadMat(int id) {
	vec4 m0 = fMat(id * 5 + 0);
	vec4 m1 = fMat(id * 5 + 1);
	vec4 m2 = fMat(id * 5 + 2);
	vec4 m3 = fMat(id * 5 + 3);
	vec4 m4 = fMat(id * 5 + 4);
	Mat m;
	m.tint = m0.rgb;
	m.flags = int(m0.a + 0.5);
	m.rect = m1;
	m.rough = m2.x; m.metal = m2.y; m.emis = m2.z; m.ior = m2.w;
	m.transm = m3.x; m.cutoff = m3.y; m.nscale = m3.z;
	m.amode = int(m3.w + 0.5);
	m.emisColor = m4.rgb;
	return m;
}

vec3 srgbToLin(vec3 c) {
	return mix(c / 12.92, pow(max(c + 0.055, vec3(0.0)) / 1.055, vec3(2.4)), step(vec3(0.04045), c));
}

vec4 fetchAtlas(sampler2D atlas, vec4 rect, vec2 f, bool rep) {
	vec2 sz = max(rect.zw, vec2(1.0));
	if (rep) f = mod(f, sz);
	f = clamp(f, vec2(0.0), sz - 1.0);
	return texelFetch(atlas, ivec2(rect.xy + f), 0);
}

vec4 sampleAtlas(sampler2D atlas, vec4 rect, vec2 uvIn, bool rep) {
	vec2 uv = vec2(uvIn.x, 1.0 - uvIn.y);
	vec2 sz = max(rect.zw, vec2(1.0));
	if (uFilterLinear == 0) {
		return fetchAtlas(atlas, rect, floor(uv * sz), rep);
	}
	vec2 t = uv * sz - 0.5;
	vec2 f0 = floor(t);
	vec2 fr = t - f0;
	vec4 c00 = fetchAtlas(atlas, rect, f0, rep);
	vec4 c10 = fetchAtlas(atlas, rect, f0 + vec2(1.0, 0.0), rep);
	vec4 c01 = fetchAtlas(atlas, rect, f0 + vec2(0.0, 1.0), rep);
	vec4 c11 = fetchAtlas(atlas, rect, f0 + vec2(1.0, 1.0), rep);
	return mix(mix(c00, c10, fr.x), mix(c01, c11, fr.x), fr.y);
}

struct Hit {
	float t;
	int tri;
	vec2 bc;
};

bool hitAABB(vec3 bmin, vec3 bmax, vec3 ro, vec3 invD, float tmax) {
	vec3 t0 = (bmin - ro) * invD;
	vec3 t1 = (bmax - ro) * invD;
	vec3 ts = min(t0, t1);
	vec3 tb = max(t0, t1);
	float tn = max(max(ts.x, ts.y), max(ts.z, 0.0));
	float tf = min(min(tb.x, tb.y), min(tb.z, tmax));
	return tn <= tf;
}

void triIntersect(int i, vec3 ro, vec3 rd, inout Hit hit) {
	vec3 v0 = fTri(i * 3 + 0).xyz;
	vec4 p1 = fTri(i * 3 + 1);
	vec3 v1 = p1.xyz;
	vec3 v2 = fTri(i * 3 + 2).xyz;
	vec3 e1 = v1 - v0;
	vec3 e2 = v2 - v0;
	vec3 pv = cross(rd, e2);
	float det = dot(e1, pv);
	int cull = int(p1.w + 0.5);
	if (cull == 1 && det <= 0.0) return;
	if (cull == 2 && det >= 0.0) return;
	if (abs(det) < 1e-12) return;
	float inv = 1.0 / det;
	vec3 tv = ro - v0;
	float u = dot(tv, pv) * inv;
	if (u < 0.0 || u > 1.0) return;
	vec3 qv = cross(tv, e1);
	float v = dot(rd, qv) * inv;
	if (v < 0.0 || u + v > 1.0) return;
	float t = dot(e2, qv) * inv;
	if (t > 1e-4 && t < hit.t) {
		hit.t = t; hit.tri = i; hit.bc = vec2(u, v);
	}
}

vec3 safeInvDir(vec3 d) {
	const float e = 1e-9;
	vec3 s = vec3(d.x < 0.0 ? -e : e, d.y < 0.0 ? -e : e, d.z < 0.0 ? -e : e);
	vec3 dd = vec3(abs(d.x) < e ? s.x : d.x, abs(d.y) < e ? s.y : d.y, abs(d.z) < e ? s.z : d.z);
	return 1.0 / dd;
}

void intersectBVH(vec3 ro, vec3 rd, inout Hit hit) {
	if (uTriCount == 0) return;
	vec3 invD = safeInvDir(rd);
	int stack[32];
	int sp = 0;
	stack[sp++] = 0;
	for (int guard = 0; guard < 4096; guard++) {
		if (sp <= 0) break;
		int node = stack[--sp];
		vec4 a = fBVH(node * 2);
		vec4 b = fBVH(node * 2 + 1);
		if (!hitAABB(a.xyz, b.xyz, ro, invD, hit.t)) continue;
		int count = int(b.w + 0.5);
		if (count > 0) {
			int start = int(a.w + 0.5);
			for (int i = 0; i < count; i++) triIntersect(start + i, ro, rd, hit);
		} else if (sp <= 30) {
			int left = int(a.w + 0.5);
			stack[sp++] = left + 1;
			stack[sp++] = left;
		}
	}
}

void intersectGround(vec3 ro, vec3 rd, inout Hit hit) {
	if (uGroundOn == 0) return;
	if (abs(rd.y) < 1e-7) return;
	float t = (uGroundY - ro.y) / rd.y;
	if (t <= 1e-4 || t >= hit.t) return;
	vec3 p = ro + rd * t;
	if (uGroundRadius > 0.0 && dot(p.xz, p.xz) > uGroundRadius * uGroundRadius) return;
	hit.t = t; hit.tri = -2; hit.bc = vec2(0.0);
}

void intersectScene(vec3 ro, vec3 rd, inout Hit hit) {
	intersectGround(ro, rd, hit);
	intersectBVH(ro, rd, hit);
}

struct Surface {
	vec3 pos, ng, ns;
	vec2 uv;
	vec3 albedo;
	float alpha, rough, metal, transm, ior, cutoff;
	int amode;
	vec3 emission;
	bool isLight;
};

void triVerts(int i, out vec3 v0, out vec3 v1, out vec3 v2) {
	v0 = fTri(i * 3 + 0).xyz;
	v1 = fTri(i * 3 + 1).xyz;
	v2 = fTri(i * 3 + 2).xyz;
}

vec2 triUV(int i, vec2 bc) {
	vec4 a0 = fAttr(i * 4 + 0);
	vec4 a1 = fAttr(i * 4 + 1);
	vec4 a2 = fAttr(i * 4 + 2);
	vec4 a3 = fAttr(i * 4 + 3);
	vec2 uv0 = vec2(a0.w, a1.w);
	vec2 uv1 = vec2(a2.w, a3.x);
	vec2 uv2 = vec2(a3.y, a3.z);
	float w = 1.0 - bc.x - bc.y;
	return uv0 * w + uv1 * bc.x + uv2 * bc.y;
}

Mat matOfTri(int i) {
	return loadMat(int(fTri(i * 3 + 0).w + 0.5));
}

float alphaOfTri(int i, vec2 bc, Mat m) {
	if ((m.flags & MF_HAS_COLOR) == 0) return 1.0;
	vec2 uv = triUV(i, bc);
	bool rep = (m.flags & MF_WRAP_REPEAT) != 0;
	return sampleAtlas(uAtlasC, m.rect, uv, rep).a;
}

bool alphaPassThrough(Mat m, float alpha) {
	if (m.amode == 0) return false;
	if (m.amode == 1) return alpha < m.cutoff;
	return rnd() >= alpha;
}

vec3 triEmission(int i, vec2 bc) {
	int matId = int(fTri(i * 3 + 0).w + 0.5);
	Mat m = loadMat(matId);
	vec2 uv = triUV(i, bc);
	bool rep = (m.flags & MF_WRAP_REPEAT) != 0;
	vec3 base = m.tint;
	if ((m.flags & MF_HAS_COLOR) != 0) base *= srgbToLin(sampleAtlas(uAtlasC, m.rect, uv, rep).rgb);
	if ((m.flags & MF_HAS_MER) != 0) {
		float e = sampleAtlas(uAtlasM, m.rect, uv, rep).g;
		return base * e * m.emis;
	}
	if ((m.flags & MF_HAS_EMISSIVE_MAP) != 0) {
		vec3 emsCol = srgbToLin(sampleAtlas(uAtlasE, m.rect, uv, rep).rgb);
		float mask = dot(emsCol, vec3(0.2126, 0.7152, 0.0722));
		if ((m.flags & MF_EMIS_CUSTOM_COLOR) != 0) return m.emisColor * mask * m.emis;
		if ((m.flags & MF_EMIS_MAIN_COLOR) != 0) return base * mask * m.emis;
		return emsCol * m.emis;
	}
	if ((m.flags & MF_FULLBRIGHT) != 0) return base * m.emis;
	return vec3(0.0);
}

void onb(vec3 n, out vec3 t, out vec3 b) {
	float s = n.z >= 0.0 ? 1.0 : -1.0;
	float a = -1.0 / (s + n.z);
	float bb = n.x * n.y * a;
	t = vec3(1.0 + s * n.x * n.x * a, s * bb, -s * n.x);
	b = vec3(bb, s + n.y * n.y * a, -n.y);
}

Surface getSurface(Hit hit, vec3 ro, vec3 rd) {
	Surface s;
	s.pos = ro + rd * hit.t;
	s.isLight = false;
	s.transm = 0.0;
	s.ior = 1.5;
	s.cutoff = 0.0;
	s.alpha = 1.0;
	s.amode = 0;
	s.emission = vec3(0.0);

	if (hit.tri == -2) {
		s.ng = vec3(0.0, 1.0, 0.0);
		s.ns = s.ng;
		s.uv = vec2(0.0);
		s.albedo = uGroundColor;
		s.rough = uGroundRough;
		s.metal = uGroundMetal;
		if (rd.y > 0.0) { s.ng = -s.ng; s.ns = -s.ns; }
		return s;
	}

	int i = hit.tri;
	vec3 v0, v1, v2;
	triVerts(i, v0, v1, v2);
	vec3 geoN = normalize(cross(v1 - v0, v2 - v0));

	vec4 a0 = fAttr(i * 4 + 0);
	vec4 a1 = fAttr(i * 4 + 1);
	vec4 a2 = fAttr(i * 4 + 2);
	vec4 a3 = fAttr(i * 4 + 3);
	float w = 1.0 - hit.bc.x - hit.bc.y;
	vec3 sn = a0.xyz * w + a1.xyz * hit.bc.x + a2.xyz * hit.bc.y;
	if (dot(sn, sn) < 1e-12) sn = geoN; else sn = normalize(sn);
	if (dot(sn, geoN) < 0.0) geoN = -geoN;

	vec2 uv0 = vec2(a0.w, a1.w);
	vec2 uv1 = vec2(a2.w, a3.x);
	vec2 uv2 = vec2(a3.y, a3.z);
	s.uv = uv0 * w + uv1 * hit.bc.x + uv2 * hit.bc.y;
	s.isLight = a3.w > 0.5;

	if (dot(geoN, rd) > 0.0) { geoN = -geoN; sn = -sn; }
	s.ng = geoN;
	s.ns = sn;

	int matId = int(fTri(i * 3 + 0).w + 0.5);
	Mat m = loadMat(matId);
	bool rep = (m.flags & MF_WRAP_REPEAT) != 0;

	vec3 base = m.tint;
	float alpha = 1.0;
	if ((m.flags & MF_HAS_COLOR) != 0) {
		vec4 c = sampleAtlas(uAtlasC, m.rect, s.uv, rep);
		base *= srgbToLin(c.rgb);
		alpha = c.a;
	}
	s.albedo = base;
	s.alpha = alpha;
	s.cutoff = m.cutoff;
	s.amode = m.amode;
	s.rough = clamp(m.rough, 0.015, 1.0);
	s.metal = clamp(m.metal, 0.0, 1.0);
	s.transm = clamp(m.transm, 0.0, 1.0);
	s.ior = max(m.ior, 1.001);

	if ((m.flags & MF_HAS_MER) != 0) {
		vec3 mer = sampleAtlas(uAtlasM, m.rect, s.uv, rep).rgb;
		s.metal = clamp(mer.r, 0.0, 1.0);
		s.rough = clamp(mer.b, 0.015, 1.0);
		s.emission = base * mer.g * m.emis;
	} else if ((m.flags & MF_HAS_EMISSIVE_MAP) != 0) {
		vec3 emsCol = srgbToLin(sampleAtlas(uAtlasE, m.rect, s.uv, rep).rgb);
		float mask = dot(emsCol, vec3(0.2126, 0.7152, 0.0722));
		if ((m.flags & MF_EMIS_CUSTOM_COLOR) != 0) {
			s.emission = m.emisColor * mask * m.emis;
		} else if ((m.flags & MF_EMIS_MAIN_COLOR) != 0) {
			s.emission = base * mask * m.emis;
		} else {
			s.emission = emsCol * m.emis;
		}
	} else if ((m.flags & MF_FULLBRIGHT) != 0) {
		s.emission = base * m.emis;
	}

	if ((m.flags & MF_HAS_NORMAL) != 0 && m.nscale > 0.0) {
		vec2 d1 = uv1 - uv0;
		vec2 d2 = uv2 - uv0;
		float r = d1.x * d2.y - d2.x * d1.y;
		if (abs(r) > 1e-9) {
			vec3 e1 = v1 - v0;
			vec3 e2 = v2 - v0;
			vec3 T = (e1 * d2.y - e2 * d1.y) / r;
			T = normalize(T - s.ns * dot(s.ns, T));
			if (dot(T, T) > 0.5) {
				vec3 B = cross(s.ns, T);
				vec3 nt = sampleAtlas(uAtlasN, m.rect, s.uv, rep).rgb * 2.0 - 1.0;
				nt.xy *= m.nscale;
				vec3 mapped = normalize(T * nt.x + B * nt.y + s.ns * max(nt.z, 0.05));
				if (dot(mapped, s.ng) > 0.0) s.ns = mapped;
			}
		}
	}
	return s;
}

vec2 dirToEnvUV(vec3 d) {
	float phi = atan(d.z, d.x) + uEnvRotation;
	float u = fract(phi * 0.15915494309189535 + 0.5);
	float v = acos(clamp(d.y, -1.0, 1.0)) * INV_PI;
	return vec2(u, clamp(v, 0.0, 1.0));
}

vec3 envRadiance(vec3 d) {
	return texture(uEnv, dirToEnvUV(d)).rgb * uEnvIntensity;
}

float envPdfDir(vec3 d) {
	int W = uEnvDist.x, H = uEnvDist.y;
	vec2 uv = dirToEnvUV(d);
	int x = clamp(int(uv.x * float(W)), 0, W - 1);
	int y = clamp(int(uv.y * float(H)), 0, H - 1);
	float pm = (texelFetch(uEnvMarg, ivec2(y + 1, 0), 0).r - texelFetch(uEnvMarg, ivec2(y, 0), 0).r) * float(H);
	float pc = (texelFetch(uEnvCond, ivec2(x + 1, y), 0).r - texelFetch(uEnvCond, ivec2(x, y), 0).r) * float(W);
	float sinT = sqrt(max(0.0, 1.0 - d.y * d.y));
	if (sinT < 1e-5) return 0.0;
	return (pm * pc) / (2.0 * PI * PI * sinT);
}

vec3 envSampleDir(out vec3 L, out float pdf) {
	int W = uEnvDist.x, H = uEnvDist.y;
	float r1 = rnd(), r2 = rnd();
	int lo = 0, hi = H;
	for (int i = 0; i < 12; i++) {
		if (lo + 1 >= hi) break;
		int mid = (lo + hi) >> 1;
		if (texelFetch(uEnvMarg, ivec2(mid, 0), 0).r <= r1) lo = mid; else hi = mid;
	}
	int y = lo;
	float m0 = texelFetch(uEnvMarg, ivec2(y, 0), 0).r;
	float m1 = texelFetch(uEnvMarg, ivec2(y + 1, 0), 0).r;
	float dy = (m1 > m0) ? (r1 - m0) / (m1 - m0) : 0.5;

	lo = 0; hi = W;
	for (int i = 0; i < 12; i++) {
		if (lo + 1 >= hi) break;
		int mid = (lo + hi) >> 1;
		if (texelFetch(uEnvCond, ivec2(mid, y), 0).r <= r2) lo = mid; else hi = mid;
	}
	int x = lo;
	float c0 = texelFetch(uEnvCond, ivec2(x, y), 0).r;
	float c1 = texelFetch(uEnvCond, ivec2(x + 1, y), 0).r;
	float dx = (c1 > c0) ? (r2 - c0) / (c1 - c0) : 0.5;

	float u = (float(x) + dx) / float(W);
	float v = (float(y) + dy) / float(H);
	float theta = v * PI;
	float phi = (u - 0.5) * 2.0 * PI - uEnvRotation;
	float sinT = sin(theta);
	L = vec3(sinT * cos(phi), cos(theta), sinT * sin(phi));
	float pm = (m1 - m0) * float(H);
	float pc = (c1 - c0) * float(W);
	pdf = (sinT > 1e-5) ? (pm * pc) / (2.0 * PI * PI * sinT) : 0.0;
	return envRadiance(L);
}

vec3 sunRadianceFor(vec3 d) {
	if (uSunEnable == 0) return vec3(0.0);
	return dot(d, uSunDir) >= uSunCosRadius ? uSunRadiance : vec3(0.0);
}
float sunPdfFor(vec3 d) {
	if (uSunEnable == 0) return 0.0;
	return dot(d, uSunDir) >= uSunCosRadius ? (1.0 / uSunSolidAngle) : 0.0;
}
vec3 sunSampleDir(out float pdf) {
	float cosT = mix(uSunCosRadius, 1.0, rnd());
	float sinT = sqrt(max(0.0, 1.0 - cosT * cosT));
	float phi = 2.0 * PI * rnd();
	vec3 t, b;
	onb(uSunDir, t, b);
	pdf = 1.0 / uSunSolidAngle;
	return normalize(t * (sinT * cos(phi)) + b * (sinT * sin(phi)) + uSunDir * cosT);
}

float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
float powerHeuristic(float a, float b) {
	float aa = a * a, bb = b * b;
	return aa / max(aa + bb, 1e-9);
}
float specProb(vec3 albedo, float metal) {
	float ds = luma(albedo) * (1.0 - metal);
	float ss = luma(mix(vec3(0.04), albedo, metal)) + metal * 0.5;
	return clamp(ss / max(ds + ss, 1e-4), 0.12, 0.9);
}
float distGGX(float NoH, float a) {
	float a2 = a * a;
	float d = NoH * NoH * (a2 - 1.0) + 1.0;
	return a2 / max(PI * d * d, 1e-9);
}
float smithG(float NoV, float NoL, float a) {
	float a2 = a * a;
	float gv = NoL * sqrt(NoV * NoV * (1.0 - a2) + a2);
	float gl = NoV * sqrt(NoL * NoL * (1.0 - a2) + a2);
	return 0.5 / max(gv + gl, 1e-9);
}

vec3 bsdfEval(vec3 N, vec3 V, vec3 L, vec3 albedo, float rough, float metal, out float pdf) {
	pdf = 0.0;
	float NoL = dot(N, L);
	float NoV = dot(N, V);
	if (NoL <= 0.0 || NoV <= 0.0) return vec3(0.0);
	vec3 H = normalize(V + L);
	float NoH = max(dot(N, H), 0.0);
	float VoH = max(dot(V, H), 1e-5);
	float a = max(rough * rough, 1e-4);
	vec3 f0 = mix(vec3(0.04), albedo, metal);
	vec3 F = f0 + (1.0 - f0) * pow(clamp(1.0 - VoH, 0.0, 1.0), 5.0);
	float D = distGGX(NoH, a);
	float Vis = smithG(NoV, NoL, a);
	vec3 spec = F * D * Vis;
	vec3 diff = albedo * (1.0 - metal) * INV_PI;
	float ps = specProb(albedo, metal);
	float pdfS = D * NoH / (4.0 * VoH);
	float pdfD = NoL * INV_PI;
	pdf = mix(pdfD, pdfS, ps);
	return (diff + spec) * NoL;
}

vec3 cosineSample(vec3 n, vec2 u) {
	float r = sqrt(u.x);
	float phi = 2.0 * PI * u.y;
	vec3 t, b;
	onb(n, t, b);
	return normalize(t * (r * cos(phi)) + b * (r * sin(phi)) + n * sqrt(max(0.0, 1.0 - u.x)));
}

vec3 ggxSampleH(vec3 n, float a, vec2 u) {
	float phi = 2.0 * PI * u.x;
	float cosT = sqrt(max(0.0, (1.0 - u.y) / (1.0 + (a * a - 1.0) * u.y)));
	float sinT = sqrt(max(0.0, 1.0 - cosT * cosT));
	vec3 t, b;
	onb(n, t, b);
	return normalize(t * (sinT * cos(phi)) + b * (sinT * sin(phi)) + n * cosT);
}

bool bsdfSample(vec3 N, vec3 V, vec3 albedo, float rough, float metal, out vec3 L, out vec3 weight, out float pdf) {
	float ps = specProb(albedo, metal);
	float a = max(rough * rough, 1e-4);
	if (rnd() < ps) {
		vec3 H = ggxSampleH(N, a, rnd2());
		L = reflect(-V, H);
	} else {
		L = cosineSample(N, rnd2());
	}
	if (dot(N, L) <= 0.0) return false;
	vec3 f = bsdfEval(N, V, L, albedo, rough, metal, pdf);
	if (pdf <= 1e-8) return false;
	weight = f / pdf;
	return true;
}

float fresnelDielectric(float cosI, float eta) {
	float s2 = eta * eta * (1.0 - cosI * cosI);
	if (s2 > 1.0) return 1.0;
	float cosT = sqrt(max(0.0, 1.0 - s2));
	float rs = (eta * cosI - cosT) / (eta * cosI + cosT);
	float rp = (cosI - eta * cosT) / (cosI + eta * cosT);
	return 0.5 * (rs * rs + rp * rp);
}

bool anyHitBVH(vec3 ro, vec3 rd, float maxT) {
	if (uTriCount == 0) return false;
	vec3 invD = safeInvDir(rd);
	int stack[32];
	int sp = 0;
	stack[sp++] = 0;
	for (int guard = 0; guard < 4096; guard++) {
		if (sp <= 0) break;
		int node = stack[--sp];
		vec4 a = fBVH(node * 2);
		vec4 b = fBVH(node * 2 + 1);
		if (!hitAABB(a.xyz, b.xyz, ro, invD, maxT)) continue;
		int count = int(b.w + 0.5);
		if (count > 0) {
			int start = int(a.w + 0.5);
			for (int i = 0; i < count; i++) {
				Hit h;
				h.t = maxT;
				h.tri = -1;
				h.bc = vec2(0.0);
				triIntersect(start + i, ro, rd, h);
				if (h.tri >= 0) {
					Mat hm = matOfTri(h.tri);
					if (hm.amode == 0 || !alphaPassThrough(hm, alphaOfTri(h.tri, h.bc, hm))) return true;
				}
			}
		} else if (sp <= 30) {
			int left = int(a.w + 0.5);
			stack[sp++] = left + 1;
			stack[sp++] = left;
		}
	}
	return false;
}

bool occluded(vec3 ro, vec3 rd, float maxT, bool skipGround) {
	if (!skipGround && uGroundOn == 1) {
		Hit gh;
		gh.t = maxT;
		gh.tri = -1;
		gh.bc = vec2(0.0);
		intersectGround(ro, rd, gh);
		if (gh.tri == -2) return true;
	}
	return anyHitBVH(ro, rd, maxT);
}

struct LightSample { vec3 dir; vec3 radiance; float pdf; float dist; };

LightSample sampleTriLight(vec3 p) {
	LightSample ls;
	ls.dir = vec3(0.0, 1.0, 0.0);
	ls.radiance = vec3(0.0);
	ls.pdf = 0.0;
	ls.dist = 0.0;
	if (uLightCount == 0) return ls;

	int li = min(int(rnd() * float(uLightCount)), uLightCount - 1);
	int tri = int(texelFetch(uLightTex, ivec2(li - (li / uLightW) * uLightW, li / uLightW), 0).r + 0.5);
	vec3 v0, v1, v2;
	triVerts(tri, v0, v1, v2);
	float su = sqrt(rnd());
	float b0 = 1.0 - su;
	float b1 = rnd() * su;
	float b2 = max(0.0, 1.0 - b0 - b1);
	vec3 q = v0 * b0 + v1 * b1 + v2 * b2;
	vec3 cr = cross(v1 - v0, v2 - v0);
	float area2 = length(cr);
	if (area2 < 1e-9) return ls;
	vec3 nl = cr / area2;
	float area = 0.5 * area2;

	vec3 dv = q - p;
	float d2 = dot(dv, dv);
	if (d2 < 1e-8) return ls;
	float d = sqrt(d2);
	ls.dir = dv / d;
	ls.dist = d;
	float cosL = abs(dot(nl, ls.dir));
	if (cosL < 1e-5) return ls;
	ls.pdf = d2 / (cosL * area * float(uLightCount));
	ls.radiance = triEmission(tri, vec2(b1, b2));
	return ls;
}

float triLightPdf(int tri, vec3 from, vec3 hitP) {
	if (uLightCount == 0) return 0.0;
	vec3 v0, v1, v2;
	triVerts(tri, v0, v1, v2);
	vec3 cr = cross(v1 - v0, v2 - v0);
	float area2 = length(cr);
	if (area2 < 1e-9) return 0.0;
	vec3 nl = cr / area2;
	vec3 dv = hitP - from;
	float d2 = dot(dv, dv);
	float d = sqrt(max(d2, 1e-12));
	float cosL = abs(dot(nl, dv / d));
	if (cosL < 1e-5) return 0.0;
	return d2 / (cosL * 0.5 * area2 * float(uLightCount));
}

float shadowCatcherAlpha(vec3 p, vec3 n) {
	float full = 0.0, vis = 0.0;
	if (uSunEnable == 1) {
		float pdf;
		vec3 L = sunSampleDir(pdf);
		float ndl = max(dot(n, L), 0.0);
		if (ndl > 0.0 && pdf > 0.0) {
			float c = luma(uSunRadiance) * ndl / pdf;
			full += c;
			if (!occluded(p + n * RAY_EPS, L, TFAR, true)) vis += c;
		}
	}
	{
		vec3 L;
		float pdf;
		vec3 Le = envSampleDir(L, pdf);
		float ndl = max(dot(n, L), 0.0);
		if (ndl > 0.0 && pdf > 1e-8) {
			float c = luma(Le) * ndl / pdf;
			full += c;
			if (!occluded(p + n * RAY_EPS, L, TFAR, true)) vis += c;
		}
	}
	if (full <= 1e-8) return 0.0;
	return clamp(1.0 - vis / full, 0.0, 1.0);
}

vec3 tracePath(vec3 ro, vec3 rd, out float alphaOut, out vec3 gAlbedo, out vec3 gNormal, out float gDepth) {
	vec3 radiance = vec3(0.0);
	vec3 beta = vec3(1.0);
	float lastPdf = 0.0;
	bool specularPath = true;
	alphaOut = 1.0;
	gAlbedo = vec3(0.0);
	gNormal = vec3(0.0);
	gDepth = 1.0e6;
	bool gWritten = false;
	int bounce = 0;
	vec3 prevPos = ro;

	for (int iter = 0; iter < 96; iter++) {
		Hit hit;
		hit.t = TFAR;
		hit.tri = -1;
		hit.bc = vec2(0.0);
		intersectScene(ro, rd, hit);

		if (hit.tri == -1) {
			vec3 env = envRadiance(rd);
			vec3 sun = sunRadianceFor(rd);
			if (bounce == 0) {
				if (uBgMode == 1) { radiance += uBgColor; gAlbedo = uBgColor; }
				else if (uBgMode == 2) { alphaOut = 0.0; gAlbedo = vec3(0.0); }
				else { radiance += env + sun; gAlbedo = env; }
				gNormal = -rd;
			} else {
				float we = specularPath ? 1.0 : powerHeuristic(lastPdf, envPdfDir(rd));
				float ws = specularPath ? 1.0 : powerHeuristic(lastPdf, sunPdfFor(rd));
				radiance += beta * (env * we + sun * ws);
			}
			break;
		}

		Surface s = getSurface(hit, ro, rd);

		bool passThrough = false;
		if (s.amode == 1) passThrough = s.alpha < s.cutoff;
		else if (s.amode == 2) passThrough = rnd() >= s.alpha;
		if (passThrough) {
			ro = s.pos + rd * RAY_EPS;
			continue;
		}

		if (bounce == 0 && hit.tri == -2 && uGroundCatcher == 1) {
			alphaOut = shadowCatcherAlpha(s.pos, s.ng);
			gAlbedo = vec3(0.0);
			gNormal = s.ng;
			gDepth = hit.t;
			break;
		}

		if (!gWritten) {
			gAlbedo = s.albedo;
			gNormal = s.ns;
			gDepth = hit.t;
			gWritten = true;
		}

		if (dot(s.emission, s.emission) > 0.0) {
			float w = 1.0;
			if (!specularPath && s.isLight) {
				w = powerHeuristic(lastPdf, triLightPdf(hit.tri, prevPos, s.pos));
			}
			radiance += beta * s.emission * w;
		}

		if (bounce >= uMaxBounce) break;

		vec3 V = -rd;

		if (s.transm > 0.0 && rnd() < s.transm) {
			bool entering = dot(rd, s.ng) < 0.0;
			vec3 n = s.ng;
			float eta = entering ? (1.0 / s.ior) : s.ior;
			float cosI = clamp(dot(-rd, n), 0.0, 1.0);
			float F = fresnelDielectric(cosI, eta);
			vec3 newDir;
			if (rnd() < F) {
				newDir = reflect(rd, n);
			} else {
				newDir = refract(rd, n, eta);
				if (dot(newDir, newDir) < 1e-8) newDir = reflect(rd, n);
				else beta *= s.albedo;
			}
			ro = s.pos + newDir * RAY_EPS;
			rd = normalize(newDir);
			specularPath = true;
			bounce++;
			continue;
		}

		vec3 shadeOrigin = s.pos + s.ng * RAY_EPS;

		int nLS = max(uLightSamples, 1);
		float invLS = 1.0 / float(nLS);
		for (int ls_i = 0; ls_i < nLS; ls_i++) {
			vec3 L;
			float pdfL;
			vec3 Le = envSampleDir(L, pdfL);
			if (pdfL > 1e-8 && dot(L, s.ns) > 0.0 && dot(L, s.ng) > 0.0 && dot(Le, Le) > 0.0) {
				float pdfB;
				vec3 f = bsdfEval(s.ns, V, L, s.albedo, s.rough, s.metal, pdfB);
				if (dot(f, f) > 0.0 && !occluded(shadeOrigin, L, TFAR, false)) {
					radiance += beta * f * Le * powerHeuristic(pdfL, pdfB) / pdfL * invLS;
				}
			}
		}

		if (uSunEnable == 1) {
			for (int ls_i = 0; ls_i < nLS; ls_i++) {
				float pdfL;
				vec3 L = sunSampleDir(pdfL);
				if (pdfL > 0.0 && dot(L, s.ns) > 0.0 && dot(L, s.ng) > 0.0) {
					float pdfB;
					vec3 f = bsdfEval(s.ns, V, L, s.albedo, s.rough, s.metal, pdfB);
					if (dot(f, f) > 0.0 && !occluded(shadeOrigin, L, TFAR, false)) {
						radiance += beta * f * uSunRadiance * powerHeuristic(pdfL, pdfB) / pdfL * invLS;
					}
				}
			}
		}

		if (uLightCount > 0) {
			for (int ls_i = 0; ls_i < nLS; ls_i++) {
				LightSample ls = sampleTriLight(s.pos);
				if (ls.pdf > 1e-8 && dot(ls.dir, s.ns) > 0.0 && dot(ls.dir, s.ng) > 0.0 && dot(ls.radiance, ls.radiance) > 0.0) {
					float pdfB;
					vec3 f = bsdfEval(s.ns, V, ls.dir, s.albedo, s.rough, s.metal, pdfB);
					if (dot(f, f) > 0.0 && !occluded(shadeOrigin, ls.dir, ls.dist - RAY_EPS * 2.0, false)) {
						radiance += beta * f * ls.radiance * powerHeuristic(ls.pdf, pdfB) / ls.pdf * invLS;
					}
				}
			}
		}

		vec3 L, weight;
		float pdfB;
		if (!bsdfSample(s.ns, V, s.albedo, s.rough, s.metal, L, weight, pdfB)) break;
		if (dot(L, s.ng) <= 0.0) break;

		beta *= weight;
		lastPdf = pdfB;
		specularPath = false;
		prevPos = s.pos;
		ro = shadeOrigin;
		rd = L;
		bounce++;

		if (bounce > 2) {
			float q = clamp(max(beta.r, max(beta.g, beta.b)), 0.02, 0.95);
			if (rnd() > q) break;
			beta /= q;
		}
		if (dot(beta, beta) < 1e-12) break;
	}

	if (uClamp > 0.0) {
		float m = max(radiance.r, max(radiance.g, radiance.b));
		if (m > uClamp) radiance *= uClamp / m;
	}
	if (any(isnan(radiance)) || any(isinf(radiance))) radiance = vec3(0.0);
	return radiance;
}

void main() {
	ivec2 px = ivec2(gl_FragCoord.xy);
	g_rng = uint(px.x) * 1973u + uint(px.y) * 9277u + uint(uSeed) * 26699u;
	g_rng = g_rng | 1u;
	pcgNext();
	pcgNext();

	vec2 jitter = rnd2();
	vec2 ndc = ((gl_FragCoord.xy - 0.5 + jitter) / uResolution) * 2.0 - 1.0;

	vec3 ro, rd;
	if (uOrtho == 1) {
		ro = uCamPos + uCamRight * (ndc.x * uOrthoHalfHeight * uAspect) + uCamUp * (ndc.y * uOrthoHalfHeight);
		rd = normalize(uCamForward);
	} else {
		rd = normalize(uCamForward + uCamRight * (ndc.x * uTanHalfFov * uAspect) + uCamUp * (ndc.y * uTanHalfFov));
		ro = uCamPos;
		if (uAperture > 0.0 && uFocusDist > 0.0) {
			vec3 focal = ro + rd * (uFocusDist / max(dot(rd, normalize(uCamForward)), 1e-4));
			float ang = 2.0 * PI * rnd();
			float rad = uAperture * sqrt(rnd());
			ro += uCamRight * (cos(ang) * rad) + uCamUp * (sin(ang) * rad);
			rd = normalize(focal - ro);
		}
	}

	float alpha, depth;
	vec3 alb, nrm;
	vec3 c = tracePath(ro, rd, alpha, alb, nrm, depth);
	vec3 demod = c / max(alb, vec3(0.02));
	float l = dot(demod, vec3(0.2126, 0.7152, 0.0722));

	vec4 prev = vec4(0.0);
	vec4 prevA = vec4(0.0);
	vec4 prevN = vec4(0.0);
	vec4 prevM = vec4(0.0);
	if (uReset == 0) {
		prev = texelFetch(uAccum, px, 0);
		prevA = texelFetch(uAccumAlb, px, 0);
		prevN = texelFetch(uAccumNrm, px, 0);
		prevM = texelFetch(uAccumMom, px, 0);
	}
	outColor = prev + vec4(c, alpha);
	outAlbedo = prevA + vec4(alb, 1.0);
	outNormal = prevN + vec4(nrm, 1.0);
	outMoment = prevM + vec4(l, l * l, depth, 1.0);
}
`;

const FS_DENOISE = `#version 300 es
precision highp float;
precision highp sampler2D;

uniform sampler2D uColor;
uniform sampler2D uAlbedo;
uniform sampler2D uNormal;
uniform sampler2D uMoment;
uniform vec2 uResolution;
uniform int uStepSize;

layout(location = 0) out vec4 outColor;

const float kernel[3] = float[3](1.0, 2.0 / 3.0, 1.0 / 6.0);

void main() {
	ivec2 px = ivec2(gl_FragCoord.xy);
	vec4 ctr = texelFetch(uColor, px, 0);
	vec4 alb = texelFetch(uAlbedo, px, 0);
	vec4 nrm = texelFetch(uNormal, px, 0);
	vec4 mom = texelFetch(uMoment, px, 0);
	if (alb.w < 0.5) { outColor = ctr; return; }
	vec3 ctrC = ctr.rgb / max(ctr.a, 1.0);
	vec3 ctrA = alb.rgb / max(alb.a, 1.0);
	vec3 ctrN = nrm.rgb / max(nrm.a, 1.0);
	float ctrD = mom.z / max(mom.w, 1.0);
	float mean = mom.x / max(mom.w, 1.0);
	float m2 = mom.y / max(mom.w, 1.0);
	float variance = max(m2 - mean * mean, 0.0);
	float sigmaL = sqrt(variance);
	float phiL = max(sigmaL * 4.0, 1e-5);
	float phiN = 0.3;
	float phiD = max(abs(ctrD) * 0.1, 1e-3);
	vec3 sum = vec3(0.0);
	float wsum = 0.0;
	for (int y = -2; y <= 2; y++) {
		for (int x = -2; x <= 2; x++) {
			ivec2 q = px + ivec2(x, y) * uStepSize;
			if (q.x < 0 || q.x >= int(uResolution.x) || q.y < 0 || q.y >= int(uResolution.y)) continue;
			vec4 qC = texelFetch(uColor, q, 0);
			vec4 qA = texelFetch(uAlbedo, q, 0);
			vec4 qN = texelFetch(uNormal, q, 0);
			vec4 qM = texelFetch(uMoment, q, 0);
			if (qA.w < 0.5) continue;
			vec3 qcol = qC.rgb / max(qC.a, 1.0);
			vec3 qalb = qA.rgb / max(qA.a, 1.0);
			vec3 qnrm = qN.rgb / max(qN.a, 1.0);
			float qdep = qM.z / max(qM.w, 1.0);
			float wL = abs(dot(qcol / max(qalb, vec3(0.02)) - ctrC / max(ctrA, vec3(0.02)), vec3(0.2126, 0.7152, 0.0722))) / phiL;
			float wN = pow(max(0.0, dot(ctrN, qnrm)), 128.0);
			float wD = abs(qdep - ctrD) / phiD;
			float w = exp(-wL - wD) * wN * kernel[abs(x)] * kernel[abs(y)];
			sum += qcol * w;
			wsum += w;
		}
	}
	outColor = vec4(wsum > 1e-6 ? sum / wsum : ctrC, ctr.a);
}
`;

const FS_COMPOSITE = `#version 300 es
precision highp float;
precision highp sampler2D;
uniform sampler2D uInput;
uniform sampler2D uAlbedo;
out vec4 outColor;
void main() {
	ivec2 px = ivec2(gl_FragCoord.xy);
	vec4 c = texelFetch(uInput, px, 0);
	vec4 alb = texelFetch(uAlbedo, px, 0);
	if (alb.w < 0.5) { outColor = vec4(0.0); return; }
	float n = c.a;
	vec3 avg = n > 0.0 ? c.rgb / n : vec3(0.0);
	outColor = vec4(avg, 1.0);
}
`;

const FS_BLOOM_BRIGHT = `#version 300 es
precision highp float;
precision highp sampler2D;
uniform sampler2D uInput;
uniform float uThreshold;
out vec4 outColor;
void main() {
	vec3 c = texelFetch(uInput, ivec2(gl_FragCoord.xy), 0).rgb;
	float br = max(c.r, max(c.g, c.b));
	if (br > uThreshold) {
		float s = (br - uThreshold) / max(br, 1e-4);
		outColor = vec4(c * s, 1.0);
	} else {
		outColor = vec4(0.0);
	}
}
`;

const FS_BLOOM_BLUR = `#version 300 es
precision highp float;

out vec4 outColor;
void main() {

	vec3 sum = vec3(0.0);
	sum += textureLod(uInput, uv - off * 4.0, 0.0).rgb * 0.0162;

	sum += textureLod(uInput, uv + off * 1.0, 0.0).rgb * 0.1945;
	sum += textureLod(uInput, uv + off * 2.0, 0.0).rgb * 0.1216;
	sum += textureLod(uInput, uv + off * 3.0, 0.0).rgb * 0.0540;

const FS_TONEMAP = `#version 300 es
precision highp float;
precision highp sampler2D;

uniform sampler2D uInput;
uniform int uMode;
uniform float uExposure;

out vec4 outColor;

vec3 reinhard(vec3 c) {
	return c / (1.0 + c);
}

vec3 reinhardLum(vec3 c) {
	float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
	float nl = l / (1.0 + l);
	return c * (nl / max(l, 1e-4));
}

vec3 aces(vec3 x) {
	const float a = 2.51;
	const float b = 0.03;
	const float c = 2.43;
	const float d = 0.59;
	const float e = 0.14;
	return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}

vec3 filmic(vec3 x) {
	vec3 X = max(vec3(0.0), x - 0.004);
	return (X * (6.2 * X + 0.5)) / (X * (6.2 * X + 1.7) + 0.06);
}

vec3 agxDefaultContrastApprox(vec3 x) {
	vec3 x2 = x * x;
	vec3 x4 = x2 * x2;
	return + 15.5     * x4 * x2
	       - 40.14    * x4 * x
	       + 31.96    * x4
	       - 6.868    * x2 * x
	       + 0.4298   * x2
	       + 0.1191   * x
	       - 0.00232;
}

vec3 agx(vec3 val) {
	const mat3 agx_mat = mat3(
		0.842479062253094, 0.0423282422610123, 0.0423756549057051,
		0.0784335999999992, 0.878468636469772, 0.0784336,
		0.0792237451477643, 0.0791661274605434, 0.879142973793104
	);
	const mat3 agx_mat_inv = mat3(
		1.19687900512017, -0.0528968517574562, -0.0529716355144438,
		-0.0980208811401368, 1.15190312990417, -0.0980434501171241,
		-0.0990297440797205, -0.0989611768448433, 1.15107367264116
	);
	const float min_ev = -12.47393;
	const float max_ev = 4.026069;
	val = agx_mat * val;
	val = clamp(log2(val), min_ev, max_ev);
	val = (val - min_ev) / (max_ev - min_ev);
	val = agxDefaultContrastApprox(val);
	return agx_mat_inv * val;
}

void main() {
	vec3 c = texelFetch(uInput, ivec2(gl_FragCoord.xy), 0).rgb;
	c *= uExposure;
	if (uMode == 1) c = reinhard(c);
	else if (uMode == 2) c = reinhardLum(c);
	else if (uMode == 3) c = aces(c);
	else if (uMode == 4) c = filmic(c);
	else if (uMode == 5) c = agx(c);
	outColor = vec4(c, 1.0);
}
`;

const FS_FINAL = `#version 300 es
precision highp float;
precision highp sampler2D;

uniform sampler2D uInput;
uniform sampler2D uBloom;
uniform float uBloomStrength;
uniform float uSharpen;
uniform float uGrain;
uniform vec2 uResolution;
uniform float uTime;

out vec4 outColor;

float hash(vec2 p) {
	float h = dot(p, vec2(127.1, 311.7));
	return fract(sin(h) * 43758.5453123);
}

vec3 linearToSrgb(vec3 c) {
	return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c));
}

void main() {
	ivec2 px = ivec2(gl_FragCoord.xy);
	vec3 c = texelFetch(uInput, px, 0).rgb;

	if (uBloomStrength > 0.0) {
		vec3 bloom = texture(uBloom, gl_FragCoord.xy / uResolution).rgb;
		c += bloom * uBloomStrength;
	}

	if (uSharpen > 0.0) {
		vec3 n = texelFetch(uInput, px + ivec2(0, 1), 0).rgb;
		vec3 s = texelFetch(uInput, px + ivec2(0, -1), 0).rgb;
		vec3 e = texelFetch(uInput, px + ivec2(1, 0), 0).rgb;
		vec3 w = texelFetch(uInput, px + ivec2(-1, 0), 0).rgb;
		vec3 laplacian = (n + s + e + w - 4.0 * c);
		c -= laplacian * uSharpen;
	}

	if (uGrain > 0.0) {
		float noise = hash(gl_FragCoord.xy + uTime) * 2.0 - 1.0;
		c += vec3(noise) * uGrain;
	}

	c = linearToSrgb(clamp(c, 0.0, 1.0));
	outColor = vec4(c, 1.0);
}
`;

class PathTracer {
  constructor(canvas) {
    this.canvas = canvas;
    const gl = canvas.getContext('webgl2', {alpha: false, antialias: false, preserveDrawingBuffer: true});
    if (!gl) throw new Error('WebGL2 不支持');
    if (!gl.getExtension('EXT_color_buffer_float')) throw new Error('需要 EXT_color_buffer_float');
    this.gl = gl;
    this.width = canvas.width;
    this.height = canvas.height;
    this.frame = 0;
    this.triCount = 0;
    this.lightCount = 0;
    this.texTriPos = null;
    this.texTriAttr = null;
    this.texBVH = null;
    this.texMat = null;
    this.texAtlasC = null;
    this.texAtlasM = null;
    this.texAtlasN = null;
    this.texAtlasE = null;
    this.texLightList = null;
    this.texEnv = null;
    this.texEnvCond = null;
    this.texEnvMarg = null;
    this.envDistW = ENV_DIST_W;
    this.envDistH = ENV_DIST_H;

    this.texAccum = [null, null];
    this.texAccumAlb = [null, null];
    this.texAccumNrm = [null, null];
    this.texAccumMom = [null, null];
    this.texDenoise = [null, null];
    this.texComposite = null;
    this.texBloomBright = null;
    this.texBloomBlur = [null, null];
    this.texTonemap = null;

    this.fboAccum = [null, null];
    this.fboDenoise = [null, null];
    this.fboComposite = null;
    this.fboBloomBright = null;
    this.fboBloomBlur = [null, null];
    this.fboTonemap = null;

    this.progPathtrace = null;
    this.progDenoise = null;
    this.progComposite = null;
    this.progBloomBright = null;
    this.progBloomBlur = null;
    this.progTonemap = null;
    this.progFinal = null;

    this.settings = {
      max_bounce: 8,
      light_samples: 1,
      clamp: 0,
      filter_linear: 0,
      cam_pos: [0, 10, 20],
      cam_target: [0, 10, 0],
      cam_fov: 45,
      ortho: 0,
      ortho_height: 10,
      aperture: 0,
      focus_dist: 20,
      env_mode: 'sky',
      env_intensity: 1.0,
      env_rotation: 0,
      bg_mode: 0,
      bg_color: [0, 0, 0],
      sky_zenith: '#4A90E2',
      sky_horizon: '#E2A574',
      sky_ground: '#3A3A3A',
      sky_haze: 0.3,
      grad_top: '#FFFFFF',
      grad_bottom: '#000000',
      solid_color: '#808080',
      sun_enable: 1,
      sun_elevation: 45,
      sun_azimuth: 135,
      sun_color: '#FFFFFF',
      sun_intensity: 5.0,
      sun_radius: 0.5,
      ground_on: 1,
      ground_catcher: 0,
      ground_y: 0,
      ground_rough: 0.8,
      ground_metal: 0.0,
      ground_radius: 0,
      ground_color: [0.5, 0.5, 0.5],
      denoise_on: 1,
      bloom_on: 0,
      bloom_threshold: 1.0,
      bloom_strength: 0.04,
      tonemap_mode: 0,
      exposure: 1.0,
      sharpen: 0.0,
      grain: 0.0
    };
  }

  compileShaders() {
    const gl = this.gl;
    this.progPathtrace = createProgram(gl, VS_FULLSCREEN, FS_PATHTRACE, 'pathtrace');
    this.progDenoise = createProgram(gl, VS_FULLSCREEN, FS_DENOISE, 'denoise');
    this.progComposite = createProgram(gl, VS_FULLSCREEN, FS_COMPOSITE, 'composite');
    this.progBloomBright = createProgram(gl, VS_FULLSCREEN, FS_BLOOM_BRIGHT, 'bloom_bright');
    this.progBloomBlur = createProgram(gl, VS_FULLSCREEN, FS_BLOOM_BLUR, 'bloom_blur');
    this.progTonemap = createProgram(gl, VS_FULLSCREEN, FS_TONEMAP, 'tonemap');
    this.progFinal = createProgram(gl, VS_FULLSCREEN, FS_FINAL, 'final');
  }

  setGeometry(positions, normals, uvs, materials) {
    const gl = this.gl;
    this.triCount = positions.length / 9;

    const triPosData = new Float32Array(this.triCount * TRI_POS_TEXELS * 4);
    for (let i = 0; i < this.triCount; i++) {
      const o = i * 9;
      triPosData[i * 12 + 0] = positions[o];
      triPosData[i * 12 + 1] = positions[o + 1];
      triPosData[i * 12 + 2] = positions[o + 2];
      triPosData[i * 12 + 3] = materials[i];
      triPosData[i * 12 + 4] = positions[o + 3];
      triPosData[i * 12 + 5] = positions[o + 4];
      triPosData[i * 12 + 6] = positions[o + 5];
      triPosData[i * 12 + 7] = 0;
      triPosData[i * 12 + 8] = positions[o + 6];
      triPosData[i * 12 + 9] = positions[o + 7];
      triPosData[i * 12 + 10] = positions[o + 8];
      triPosData[i * 12 + 11] = 0;
    }

    const triAttrData = new Float32Array(this.triCount * TRI_ATTR_TEXELS * 4);
    for (let i = 0; i < this.triCount; i++) {
      const o = i * 9;
      const u = i * 6;
      triAttrData[i * 16 + 0] = normals[o];
      triAttrData[i * 16 + 1] = normals[o + 1];
      triAttrData[i * 16 + 2] = normals[o + 2];
      triAttrData[i * 16 + 3] = uvs[u];
      triAttrData[i * 16 + 4] = normals[o + 3];
      triAttrData[i * 16 + 5] = normals[o + 4];
      triAttrData[i * 16 + 6] = normals[o + 5];
      triAttrData[i * 16 + 7] = uvs[u + 1];
      triAttrData[i * 16 + 8] = normals[o + 6];
      triAttrData[i * 16 + 9] = normals[o + 7];
      triAttrData[i * 16 + 10] = normals[o + 8];
      triAttrData[i * 16 + 11] = uvs[u + 2];
      triAttrData[i * 16 + 12] = uvs[u + 3];
      triAttrData[i * 16 + 13] = uvs[u + 4];
      triAttrData[i * 16 + 14] = uvs[u + 5];
      triAttrData[i * 16 + 15] = 0;
    }

    const bvh = buildBVH(positions, this.triCount);
    const bvhData = new Float32Array(bvh.nodeCount * BVH_TEXELS * 4);
    for (let i = 0; i < bvh.nodeCount; i++) {
      const s = i * 8;
      bvhData[i * 8 + 0] = bvh.nodes[s + 0];
      bvhData[i * 8 + 1] = bvh.nodes[s + 1];
      bvhData[i * 8 + 2] = bvh.nodes[s + 2];
      bvhData[i * 8 + 3] = bvh.nodes[s + 3];
      bvhData[i * 8 + 4] = bvh.nodes[s + 4];
      bvhData[i * 8 + 5] = bvh.nodes[s + 5];
      bvhData[i * 8 + 6] = bvh.nodes[s + 6];
      bvhData[i * 8 + 7] = bvh.nodes[s + 7];
    }

    this.texTriPos = createDataTexture(gl, triPosData, this.triCount * TRI_POS_TEXELS);
    this.texTriAttr = createDataTexture(gl, triAttrData, this.triCount * TRI_ATTR_TEXELS);
    this.texBVH = createDataTexture(gl, bvhData, bvh.nodeCount * BVH_TEXELS);
  }

  setMaterials(matArray) {
    const gl = this.gl;
    const matData = new Float32Array(matArray.length * MAT_TEXELS * 4);
    for (let i = 0; i < matArray.length; i++) {
      const m = matArray[i];
      const o = i * 20;
      matData[o + 0] = m.tint[0];
      matData[o + 1] = m.tint[1];
      matData[o + 2] = m.tint[2];
      matData[o + 3] = m.flags;
      matData[o + 4] = m.rect[0];
      matData[o + 5] = m.rect[1];
      matData[o + 6] = m.rect[2];
      matData[o + 7] = m.rect[3];
      matData[o + 8] = m.rough;
      matData[o + 9] = m.metal;
      matData[o + 10] = m.emis;
      matData[o + 11] = m.ior;
      matData[o + 12] = m.transm;
      matData[o + 13] = m.cutoff;
      matData[o + 14] = m.nscale;
      matData[o + 15] = m.amode;
      matData[o + 16] = m.emisColor[0];
      matData[o + 17] = m.emisColor[1];
      matData[o + 18] = m.emisColor[2];
      matData[o + 19] = 0;
    }
    this.texMat = createDataTexture(gl, matData, matArray.length * MAT_TEXELS);
  }

  setAtlases(cPixels, cW, cH, mPixels, mW, mH, nPixels, nW, nH, ePixels, eW, eH) {
    const gl = this.gl;
    if (cPixels) this.texAtlasC = createAtlasTexture(gl, cPixels, cW, cH);
    if (mPixels) this.texAtlasM = createAtlasTexture(gl, mPixels, mW, mH);
    if (nPixels) this.texAtlasN = createAtlasTexture(gl, nPixels, nW, nH);
    if (ePixels) this.texAtlasE = createAtlasTexture(gl, ePixels, eW, eH);
  }

  setLights(lightIndices) {
    const gl = this.gl;
    this.lightCount = lightIndices.length;
    if (this.lightCount === 0) return;
    const data = new Float32Array(this.lightCount * 4);
    for (let i = 0; i < this.lightCount; i++) data[i * 4] = lightIndices[i];
    this.texLightList = createDataTexture(gl, data, this.lightCount);
  }

  updateEnvironment() {
    const gl = this.gl;
    const pixels = generateSkyPixels(this.settings);
    this.texEnv = createEnvTexture(gl, pixels, ENV_W, ENV_H);
    const dist = buildEnvDistribution(pixels, ENV_W, ENV_H);
    const condData = new Float32Array((dist.width + 1) * dist.height);
    condData.set(dist.cond);
    const margData = new Float32Array(dist.height + 1);
    margData.set(dist.marg);
    this.texEnvCond = createR32FTexture(gl, condData, dist.width + 1, dist.height);
    this.texEnvMarg = createR32FTexture(gl, margData, dist.height + 1, 1);
    this.envDistW = dist.width;
    this.envDistH = dist.height;
  }

  allocateBuffers() {
    const gl = this.gl;
    const w = this.width, h = this.height;
    for (let i = 0; i < 2; i++) {
      this.texAccum[i] = createRenderTexture(gl, w, h, gl.RGBA32F);
      this.texAccumAlb[i] = createRenderTexture(gl, w, h, gl.RGBA32F);
      this.texAccumNrm[i] = createRenderTexture(gl, w, h, gl.RGBA32F);
      this.texAccumMom[i] = createRenderTexture(gl, w, h, gl.RGBA32F);
      this.fboAccum[i] = createFBO(gl, [this.texAccum[i], this.texAccumAlb[i], this.texAccumNrm[i], this.texAccumMom[i]]);
      this.texDenoise[i] = createRenderTexture(gl, w, h, gl.RGBA32F);
      this.fboDenoise[i] = createFBO(gl, [this.texDenoise[i]]);
    }
    this.texComposite = createRenderTexture(gl, w, h, gl.RGBA32F);
    this.fboComposite = createFBO(gl, [this.texComposite]);
    const bw = Math.max(1, w >> 2), bh = Math.max(1, h >> 2);
    this.texBloomBright = createRenderTexture(gl, bw, bh, gl.RGBA32F);
    this.fboBloomBright = createFBO(gl, [this.texBloomBright]);
    this.texBloomBlur[0] = createRenderTexture(gl, bw, bh, gl.RGBA32F);
    this.texBloomBlur[1] = createRenderTexture(gl, bw, bh, gl.RGBA32F);
    this.fboBloomBlur[0] = createFBO(gl, [this.texBloomBlur[0]]);
    this.fboBloomBlur[1] = createFBO(gl, [this.texBloomBlur[1]]);
    this.texTonemap = createRenderTexture(gl, w, h, gl.RGBA32F);
    this.fboTonemap = createFBO(gl, [this.texTonemap]);
  }

  render() {
    const gl = this.gl;
    const s = this.settings;
    const src = this.frame % 2;
    const dst = 1 - src;

    const forward = vNorm(vSub(s.cam_target, s.cam_pos));
    const right = vNorm(vCross(forward, [0, 1, 0]));
    const up = vCross(right, forward);
    const tanHalfFov = Math.tan(s.cam_fov * Math.PI / 360);
    const aspect = this.width / this.height;

    const sunDir = sunDirection(s);
    const sunRadiusRad = s.sun_radius * Math.PI / 180;
    const sunCosRadius = Math.cos(sunRadiusRad);
    const sunSolidAngle = 2 * Math.PI * (1 - sunCosRadius);
    const sunRadiance = vScale(hexToLinear(s.sun_color), s.sun_intensity);

    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fboAccum[dst]);
    gl.viewport(0, 0, this.width, this.height);
    gl.useProgram(this.progPathtrace.program);
    const u = this.progPathtrace.uniforms;
    gl.uniform2f(u.uResolution, this.width, this.height);
    gl.uniform1i(u.uSeed, this.frame);
    gl.uniform1i(u.uMaxBounce, s.max_bounce);
    gl.uniform1i(u.uLightSamples, s.light_samples);
    gl.uniform1f(u.uClamp, s.clamp);
    gl.uniform1i(u.uFilterLinear, s.filter_linear);
    gl.uniform3fv(u.uCamPos, s.cam_pos);
    gl.uniform3fv(u.uCamRight, right);
    gl.uniform3fv(u.uCamUp, up);
    gl.uniform3fv(u.uCamForward, forward);
    gl.uniform1f(u.uTanHalfFov, tanHalfFov);
    gl.uniform1f(u.uAspect, aspect);
    gl.uniform1f(u.uOrthoHalfHeight, s.ortho_height);
    gl.uniform1i(u.uOrtho, s.ortho);
    gl.uniform1f(u.uAperture, s.aperture);
    gl.uniform1f(u.uFocusDist, s.focus_dist);

    gl.uniform1i(u.uTriPos, 0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.texTriPos.texture);
    gl.uniform1i(u.uTriPosW, this.texTriPos.width);

    gl.uniform1i(u.uTriAttr, 1);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, this.texTriAttr.texture);
    gl.uniform1i(u.uTriAttrW, this.texTriAttr.width);

    gl.uniform1i(u.uBVH, 2);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, this.texBVH.texture);
    gl.uniform1i(u.uBVHW, this.texBVH.width);

    gl.uniform1i(u.uMat, 3);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, this.texMat.texture);
    gl.uniform1i(u.uMatW, this.texMat.width);

    gl.uniform1i(u.uAtlasC, 4);
    gl.activeTexture(gl.TEXTURE4);
    gl.bindTexture(gl.TEXTURE_2D, this.texAtlasC || this.texMat.texture);

    gl.uniform1i(u.uAtlasM, 5);
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D, this.texAtlasM || this.texMat.texture);

    gl.uniform1i(u.uAtlasN, 6);
    gl.activeTexture(gl.TEXTURE6);
    gl.bindTexture(gl.TEXTURE_2D, this.texAtlasN || this.texMat.texture);

    gl.uniform1i(u.uAtlasE, 7);
    gl.activeTexture(gl.TEXTURE7);
    gl.bindTexture(gl.TEXTURE_2D, this.texAtlasE || this.texMat.texture);

    gl.uniform1i(u.uLightTex, 8);
    gl.activeTexture(gl.TEXTURE8);
    gl.bindTexture(gl.TEXTURE_2D, this.texLightList ? this.texLightList.texture : this.texMat.texture);
    gl.uniform1i(u.uLightW, this.texLightList ? this.texLightList.width : 1);
    gl.uniform1i(u.uLightCount, this.lightCount);
    gl.uniform1i(u.uTriCount, this.triCount);

    gl.uniform1i(u.uEnv, 9);
    gl.activeTexture(gl.TEXTURE9);
    gl.bindTexture(gl.TEXTURE_2D, this.texEnv);

    gl.uniform1i(u.uEnvCond, 10);
    gl.activeTexture(gl.TEXTURE10);
    gl.bindTexture(gl.TEXTURE_2D, this.texEnvCond);

    gl.uniform1i(u.uEnvMarg, 11);
    gl.activeTexture(gl.TEXTURE11);
    gl.bindTexture(gl.TEXTURE_2D, this.texEnvMarg);

    gl.uniform2i(u.uEnvDist, this.envDistW, this.envDistH);
    gl.uniform1f(u.uEnvIntensity, s.env_intensity);
    gl.uniform1f(u.uEnvRotation, s.env_rotation);
    gl.uniform1i(u.uBgMode, s.bg_mode);
    gl.uniform3fv(u.uBgColor, s.bg_color);

    gl.uniform1i(u.uSunEnable, s.sun_enable);
    gl.uniform3fv(u.uSunDir, sunDir);
    gl.uniform1f(u.uSunCosRadius, sunCosRadius);
    gl.uniform1f(u.uSunSolidAngle, sunSolidAngle);
    gl.uniform3fv(u.uSunRadiance, sunRadiance);

    gl.uniform1i(u.uGroundOn, s.ground_on);
    gl.uniform1i(u.uGroundCatcher, s.ground_catcher);
    gl.uniform1f(u.uGroundY, s.ground_y);
    gl.uniform1f(u.uGroundRough, s.ground_rough);
    gl.uniform1f(u.uGroundMetal, s.ground_metal);
    gl.uniform1f(u.uGroundRadius, s.ground_radius);
    gl.uniform3fv(u.uGroundColor, s.ground_color);

    gl.uniform1i(u.uAccum, 12);
    gl.activeTexture(gl.TEXTURE12);
    gl.bindTexture(gl.TEXTURE_2D, this.texAccum[src]);

    gl.uniform1i(u.uAccumAlb, 13);
    gl.activeTexture(gl.TEXTURE13);
    gl.bindTexture(gl.TEXTURE_2D, this.texAccumAlb[src]);

    gl.uniform1i(u.uAccumNrm, 14);
    gl.activeTexture(gl.TEXTURE14);
    gl.bindTexture(gl.TEXTURE_2D, this.texAccumNrm[src]);

    gl.uniform1i(u.uAccumMom, 15);
    gl.activeTexture(gl.TEXTURE15);
    gl.bindTexture(gl.TEXTURE_2D, this.texAccumMom[src]);

    gl.uniform1i(u.uReset, this.frame === 0 ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    if (s.denoise_on) {
      const steps = [1, 2, 4, 8];
      let srcDen = dst, dstDen = 0;
      for (let i = 0; i < steps.length; i++) {
        dstDen = i % 2;
        gl.bindFramebuffer(gl.FRAMEBUFFER, this.fboDenoise[dstDen]);
        gl.viewport(0, 0, this.width, this.height);
        gl.useProgram(this.progDenoise.program);
        const ud = this.progDenoise.uniforms;
        gl.uniform1i(ud.uColor, 0);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, i === 0 ? this.texAccum[srcDen] : this.texDenoise[srcDen]);
        gl.uniform1i(ud.uAlbedo, 1);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, this.texAccumAlb[dst]);
        gl.uniform1i(ud.uNormal, 2);
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, this.texAccumNrm[dst]);
        gl.uniform1i(ud.uMoment, 3);
        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(gl.TEXTURE_2D, this.texAccumMom[dst]);
        gl.uniform2f(ud.uResolution, this.width, this.height);
        gl.uniform1i(ud.uStepSize, steps[i]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        srcDen = dstDen;
      }
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fboComposite);
      gl.viewport(0, 0, this.width, this.height);
      gl.useProgram(this.progComposite.program);
      const uc = this.progComposite.uniforms;
      gl.uniform1i(uc.uInput, 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.texDenoise[srcDen]);
      gl.uniform1i(uc.uAlbedo, 1);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, this.texAccumAlb[dst]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fboComposite);
      gl.viewport(0, 0, this.width, this.height);
      gl.useProgram(this.progComposite.program);
      const uc = this.progComposite.uniforms;
      gl.uniform1i(uc.uInput, 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.texAccum[dst]);
      gl.uniform1i(uc.uAlbedo, 1);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, this.texAccumAlb[dst]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    let bloomTex = null;
    if (s.bloom_on) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fboBloomBright);
      const bw = Math.max(1, this.width >> 2), bh = Math.max(1, this.height >> 2);
      gl.viewport(0, 0, bw, bh);
      gl.useProgram(this.progBloomBright.program);
      const ubb = this.progBloomBright.uniforms;
      gl.uniform1i(ubb.uInput, 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.texComposite);
      gl.uniform1f(ubb.uThreshold, s.bloom_threshold);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fboBloomBlur[0]);
      gl.viewport(0, 0, bw, bh);
      gl.useProgram(this.progBloomBlur.program);
      const ublur = this.progBloomBlur.uniforms;
      gl.uniform1i(ublur.uInput, 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.texBloomBright);
      gl.uniform2f(ublur.uResolution, bw, bh);
      gl.uniform2f(ublur.uDir, 1, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fboBloomBlur[1]);
      gl.viewport(0, 0, bw, bh);
      gl.uniform1i(ublur.uInput, 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.texBloomBlur[0]);
      gl.uniform2f(ublur.uDir, 0, 1);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      bloomTex = this.texBloomBlur[1];
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fboTonemap);
    gl.viewport(0, 0, this.width, this.height);
    gl.useProgram(this.progTonemap.program);
    const ut = this.progTonemap.uniforms;
    gl.uniform1i(ut.uInput, 0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.texComposite);
    gl.uniform1i(ut.uMode, s.tonemap_mode);
    gl.uniform1f(ut.uExposure, s.exposure);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.width, this.height);
    gl.useProgram(this.progFinal.program);
    const uf = this.progFinal.uniforms;
    gl.uniform1i(uf.uInput, 0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.texTonemap);
    gl.uniform1i(uf.uBloom, 1);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, bloomTex || this.texTonemap);
    gl.uniform1f(uf.uBloomStrength, s.bloom_on ? s.bloom_strength : 0);
    gl.uniform1f(uf.uSharpen, s.sharpen);
    gl.uniform1f(uf.uGrain, s.grain);
    gl.uniform2f(uf.uResolution, this.width, this.height);
    gl.uniform1f(uf.uTime, this.frame * 0.01);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    this.frame++;
  }

  reset() {
    this.frame = 0;
  }

  toPNG() {
    return this.canvas.toDataURL('image/png');
  }
}

async function renderSkin(job) {
  try {
    const canvas = document.getElementById('view');
    canvas.width = job.width || 768;
    canvas.height = job.height || 512;

    const tracer = new PathTracer(canvas);
    tracer.compileShaders();
    tracer.allocateBuffers();

    const skinImg = await loadImage(job.skin);
    const skinCanvas = document.createElement('canvas');
    skinCanvas.width = 64;
    skinCanvas.height = 64;
    const ctx = skinCanvas.getContext('2d');
    ctx.drawImage(skinImg, 0, 0);
    const skinPixels = ctx.getImageData(0, 0, 64, 64).data;

    const positions = [];
    const normals = [];
    const uvs = [];
    const matIds = [];

    if (job.triangles && job.triangles.length > 0) {
      const rawTris = job.triangles;
      const triCount = Math.floor(rawTris.length / 20);
      for (let i = 0; i < triCount; i++) {
        const o = i * 20;
        positions.push(rawTris[o], rawTris[o + 1], rawTris[o + 2]);
        positions.push(rawTris[o + 3], rawTris[o + 4], rawTris[o + 5]);
        positions.push(rawTris[o + 6], rawTris[o + 7], rawTris[o + 8]);
        normals.push(rawTris[o + 9], rawTris[o + 10], rawTris[o + 11]);
        normals.push(rawTris[o + 12], rawTris[o + 13], rawTris[o + 14]);
        normals.push(rawTris[o + 15], rawTris[o + 16], rawTris[o + 17]);
        const u = rawTris[o + 18], v = rawTris[o + 19];
        uvs.push(u, v, u, v, u, v);
        matIds.push(0);
      }
    }

    tracer.setGeometry(new Float32Array(positions), new Float32Array(normals), new Float32Array(uvs), new Uint32Array(matIds));

    const materials = [{
      tint: [1, 1, 1],
      flags: MF_HAS_COLOR,
      rect: [0, 0, 64, 64],
      rough: 0.8,
      metal: 0.0,
      emis: 0.0,
      ior: 1.5,
      transm: 0.0,
      cutoff: 0.5,
      nscale: 1.0,
      amode: 0,
      emisColor: [1, 1, 1]
    }];
    tracer.setMaterials(materials);

    const atlasC = new Uint8Array(64 * 64 * 4);
    atlasC.set(skinPixels);
    tracer.setAtlases(atlasC, 64, 64, null, 1, 1, null, 1, 1, null, 1, 1);
    tracer.setLights([]);
    tracer.updateEnvironment();

    tracer.settings.cam_pos = [0, 10, 25];
    tracer.settings.cam_target = [0, 10, 0];
    tracer.settings.cam_fov = 35;
    tracer.settings.max_bounce = 8;
    tracer.settings.light_samples = 1;

    const samples = job.samples || 128;
    for (let i = 0; i < samples; i++) {
      tracer.render();
    }

    const png = tracer.toPNG();
    return {ok: true, png: png};
  } catch (err) {
    console.error('[renderSkin]', err);
    return {ok: false, error: err.message};
  }
}

window.renderSkin = renderSkin;
</script>
</html>

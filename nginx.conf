# 把自己的域名写进 server_name。
# 构建：pnpm build
# 启动：pnpm start
# Node 默认听 4321。改端口时同时改下面的 proxy_pass。
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml application/json application/wasm;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
